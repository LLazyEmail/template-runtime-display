# Generate the sample HTML letter and upload it.
# Install, index, artifact, and pull-request comment come from
# LLazyEmail/email-template-workflows@v2.0.0. npm run generate still builds
# and writes generated/letter.html.

name: Generate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: generate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate sample HTML
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: LLazyEmail/email-template-workflows@v2.1.0
        with:
          working-directory: .
          package-manager: npm
          command: npm run generate
          artifact-directory: generated
          artifact-name: generated-html-templates
          job-summary: true
