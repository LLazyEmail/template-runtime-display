# Generate the sample HTML letter and upload it.
# Install, index, artifact, and pull-request comment come from
# LLazyEmail/email-template-workflows@v3.
# npm run generate still builds and writes generated/letter.html.
# Explicit product-name/size-limit-kb restore the v2 email defaults that
# changed in the v3 breaking release.

name: Generate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: generate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate sample HTML
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: LLazyEmail/email-template-workflows@v3
        with:
          working-directory: .
          package-manager: npm
          command: npm run generate
          artifact-directory: generated
          artifact-name: generated-html-templates
          product-name: emails
          size-limit-kb: 102
          job-summary: true
