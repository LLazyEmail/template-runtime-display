# Generate the sample HTML letter and upload it.
# Same shape as the generate section in postmark-transactional-template-simple.

name: Generate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: generate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@llazyemail'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate HTML templates
        if: matrix.node-version == '24.x'
        run: npm run generate

      - name: Upload generated HTML
        if: matrix.node-version == '24.x'
        uses: actions/upload-artifact@v7
        with:
          name: generated-html-templates
          path: generated/
          if-no-files-found: error
